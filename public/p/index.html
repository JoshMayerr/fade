<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fade profile</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .profile-card {
        margin-top: 24px;
        padding: 20px;
        border-radius: 14px;
        background: #f7f6f9;
        border: 3px solid #d8d4df;
        text-align: center;
      }
      .profile-title {
        font-size: 18px;
        margin-bottom: 8px;
      }
      .profile-time {
        font-size: 14px;
        opacity: 0.7;
      }
      .profile-actions {
        margin-top: 16px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .profile-actions a {
        padding: 10px 16px;
        border-radius: 999px;
        border: 2px solid #000;
        text-decoration: none;
        color: #000;
        font-weight: 600;
      }
      .profile-actions a.primary {
        background: #000;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        src="/logo.svg"
        alt="fade"
        class="logo"
        draggable="false"
        width="100"
        height="50"
      />
      <div class="profile-card">
        <div class="profile-title" id="profile-name">fade friend</div>
        <div class="profile-time" id="profile-time">loading...</div>
        <div class="profile-actions">
          <a id="open-link" class="primary" href="#">Open in fade</a>
          <a id="install-link" href="#">Get the app</a>
        </div>
      </div>
    </div>
    <script src="/profile.js"></script>
  </body>
</html>
